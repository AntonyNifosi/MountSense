name: Package and Release

on:
  push:
    tags:
      - '*' # Se déclenche uniquement quand un tag est poussé (ex: v1.0.0)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Nécessaire pour générer le changelog automatique

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
